name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: python3 test_wrapper.py && python3 test_mini2_guard.py
      - run: sh -n station-volume.sh && sh -n build.sh
      - name: Tag matches plugin.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' plugin.toml)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - id: yap
        run: echo "path=$(./build.sh)" >> "$GITHUB_OUTPUT"
      - run: sha256sum "${{ steps.yap.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: station-volume-yap
          path: ${{ steps.yap.outputs.path }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "${{ steps.yap.outputs.path }}" --clobber \
            || gh release create "$GITHUB_REF_NAME" "${{ steps.yap.outputs.path }}" --title "station-volume ${GITHUB_REF_NAME#v}" --generate-notes
